<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="stylesheet" href="assets/css/brand.css">

<link rel="icon" href="assets/icons/favicon.svg?v=perfusion" type="image/svg+xml" sizes="any">

</head><body>
<title>Помощник рентгенолога</title>
<meta name="description" content="Помощник рентгенолога. Справочник для врачей и ординаторов.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1f2328; --muted: #5f6670;
    --line: #dcdfe3; --head: #eef1f4; --accent: #1d5fa8;
    --warn-bg: #fff6e0; --warn: #7a5200; --err: #b42318; --good: #1e7a3c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417; --card: #1b1e22; --ink: #e6e8eb; --muted: #9aa3ad;
      --line: #2e333a; --head: #23272d; --accent: #7fb2ee;
      --warn-bg: #2e2715; --warn: #e9c46a; --err: #ff8a80; --good: #6fcf8a;
    }
  }
  :root[data-theme="dark"] {
      --bg: #121417; --card: #1b1e22; --ink: #e6e8eb; --muted: #9aa3ad;
      --line: #2e333a; --head: #23272d; --accent: #7fb2ee;
      --warn-bg: #2e2715; --warn: #e9c46a; --err: #ff8a80; --good: #6fcf8a;
    }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 12px; }

  /* Шапка с поиском — всегда под пальцем */
  header.top { position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: max(8px, env(safe-area-inset-top)) 0 8px; }
  .bar { display: flex; gap: 8px; align-items: center; }
  #q { flex: 1; min-width: 0; height: 44px; padding: 0 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  .tool { flex: none; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); font-size: 0.85rem; cursor: pointer; }

  h1 { margin: 14px 0 0; font-size: 1.05rem; font-weight: 600; }
  .note { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg);
    color: var(--warn); font-size: 0.85rem; }
  .note p { margin: 4px 0; }
  .alert { padding: 10px 12px; border-radius: 10px; border: 2px solid var(--err);
    color: var(--err); font-size: 0.95rem; font-weight: 700; line-height: 1.4; }
  .err { margin: 10px 0; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--err);
    color: var(--err); font-size: 0.85rem; }

  /* Разделы-гармошки */
  details.sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; }
  details.sec[hidden] { display: none; }
  details.sec > summary { list-style: none; cursor: pointer; padding: 12px 40px 12px 14px;
    position: relative; -webkit-tap-highlight-color: transparent; min-height: 48px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: ""; position: absolute; right: 16px; top: 20px;
    width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); transition: transform .15s; }
  details.sec[open] > summary::after { transform: rotate(-135deg); top: 24px; }
  .t { display: block; font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
  .s { display: block; margin-top: 3px; font-size: 0.82rem; color: var(--muted); line-height: 1.35; }
  .body { padding: 0 14px 12px; border-top: 1px solid var(--line); }

  h3 { margin: 16px 0 6px; font-size: 0.95rem; }
  p, ul { margin: 8px 0; }
  ul { padding-left: 1.2em; }
  li { margin: 3px 0; }
  code.formula { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88rem;
    background: var(--head); padding: 8px 10px; border-radius: 8px; overflow-x: auto; white-space: nowrap; }
  /* Виджеты (widgets.js) */
  .widget { margin: 12px 0 4px; display: flex; flex-direction: column; gap: 10px; }
  .w-pane { display: flex; flex-direction: column; gap: 8px; }
  .w-pane[hidden] { display: none; }
  .w-label { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
  .w-conc { flex-wrap: nowrap; }
  .w-conc .pick { flex: 1 1 0; min-width: 0; max-width: 84px; text-align: center; font-size: 1rem; padding: 10px 4px; }
  .w-input { height: 48px; padding: 0 12px; font-size: 1.1rem; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); width: 100%; max-width: 220px; }
  .w-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .w-out { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; padding: 12px 14px;
    border-radius: 12px; background: var(--head); }
  .w-num { font-size: 2.2rem; font-weight: 700; line-height: 1.1; color: var(--accent); }
  .w-hint { font-size: 0.9rem; color: var(--muted); }
  .w-out.bad .w-hint { color: var(--err); font-weight: 600; }
  .w-rule { font-size: 0.78rem; color: var(--muted); }
  .w-field { display: flex; flex-direction: column; gap: 8px; }
  .w-field[hidden], .w-field-note[hidden] { display: none; }
  .w-field-note { font-size: 0.8rem; color: var(--muted); margin-top: -2px; }
  .w-zone .pick { font-size: 0.95rem; padding: 10px 12px; }
  .w-a-more { display: flex; flex-direction: column; gap: 6px; }
  .w-a-more:empty { display: none; }
  .w-line { font-size: 1.05rem; }
  .w-warn { padding: 8px 12px; border-radius: 10px; border: 2px solid var(--err); color: var(--err); font-weight: 700; }
  .w-rows { display: flex; flex-direction: column; gap: 8px; }
  .w-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
  .w-row .w-sel { flex: 1 1 100%; min-width: 0; max-width: none; font-size: 1rem; padding: 0 8px; }
  .w-row .w-dlp { flex: 1 1 auto; max-width: 200px; }
  .w-row .w-unit { color: var(--muted); font-size: 0.9rem; margin-right: auto; }
  .w-del { flex: 0 0 40px; height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--muted); font-size: 1.3rem; cursor: pointer; }
  .w-del[hidden] { visibility: hidden; display: block; }
  .w-add { align-self: flex-start; }
  .w-small { font-size: 0.9rem; color: var(--muted); }
  .w-rule a { color: inherit; }
  /* Разбор исследования (quality-check): зелёный / жёлтый / красный вердикт */
  .w-out.q-good { background: color-mix(in srgb, var(--good) 14%, var(--card)); }
  .w-out.q-good .w-num { color: var(--good); }
  .w-out.q-ok { background: var(--warn-bg); }
  .w-out.q-ok .w-num { color: var(--warn); }
  .w-out.q-bad { background: color-mix(in srgb, var(--err) 12%, var(--card)); }
  .w-out.q-bad .w-num { color: var(--err); }
  .w-qfields { display: flex; flex-direction: column; gap: 8px; }
  .w-chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 1rem; }
  .w-chk input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; }
  .w-qphase:empty { display: none; }
  .w-steps { margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .w-steps ol { margin: 6px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
  .w-stub { margin: 4px 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
  img.pic { display: block; width: 100%; max-width: 440px; height: auto; margin: 10px auto; }
  .pics { display: flex; gap: 8px; align-items: flex-start; max-width: 640px; margin: 10px auto; }
  .pics img.pic { flex: 1 1 0; min-width: 0; margin: 0; border-radius: 12px; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; }
  .src { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 0.8rem; color: var(--muted); }
  a { color: var(--accent); }

  /* Таблицы: на телефоне каждая строка — карточка с подписями колонок */
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; margin: 8px 0; }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
  th { background: var(--head); font-weight: 600; }
  td:first-child { font-weight: 600; width: 22%; }
  @media (max-width: 640px) {
    table, tbody, tr, td { display: block; width: auto; }
    thead { display: none; }
    tr { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; overflow: hidden; }
    td { border: 0; border-top: 1px solid var(--line); }
    td:first-child { border-top: 0; background: var(--head); width: auto; }
    td:not(:first-child)::before { content: attr(data-label); display: block;
      font-size: 0.75rem; color: var(--muted); margin-bottom: 1px; }
  }

  /* Шаблоны заключений */
  .study { margin: 14px 0 6px; display: flex; flex-direction: column; gap: 10px; }
  .study[hidden] { display: none; }
  body.protocol-view #list, body.protocol-view #note { display: none; }
  .study-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 0 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.78rem; }
  .share-protocol { margin-inline-start: auto; min-height: 44px; padding: 0 4px; border: 0;
    background: transparent; color: var(--accent); font: inherit; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; }
  .share-protocol:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .share-protocol:hover { text-decoration-thickness: 2px; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--ink); font-size: 0.88rem; cursor: pointer; text-align: left; }
  .pick[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .app-entry { padding: 14px; display: grid; gap: 12px; }
  .app-entry p { margin: 0; color: var(--muted); }
  .app-entry a { display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 10px 15px; border-radius: 10px; text-decoration: none;
    background: var(--accent); color: var(--card); font-weight: 700; }
  .app-entry a:hover { opacity: .9; }
  .study h2 { margin: 0; font-size: 1.1rem; line-height: 1.3; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--muted); font-size: 0.85rem; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .sheet-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--line); background: var(--head);
    font-size: 0.8rem; color: var(--muted); }
  .sheet-bar.actions { justify-content: flex-end; }
  .copy { height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent);
    color: var(--bg); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .tpl { margin: 0; padding: 12px 14px; font: 0.88rem/1.75 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; }
  /* Переключатель {а|б}: тап листает варианты */
  .tg { color: var(--accent); background: var(--head); border-bottom: 1px dashed var(--accent);
    border-radius: 3px; padding: 0 3px; cursor: pointer; }
  .tg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tg [hidden] { display: none; }
  .opt-empty { color: var(--muted); }
  .ln[hidden] { display: none; }
  /* Поле [__]: вбить число или текст */
  .fld { font: inherit; font-size: 16px; line-height: 1.2; color: var(--ink); background: var(--head);
    border: 0; border-bottom: 1.5px solid var(--accent); border-radius: 3px; padding: 0 3px;
    min-width: 3ch; max-width: 100%; box-sizing: content-box; }
  .fld:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fld::placeholder { color: var(--muted); }
  /* Незаполненное при попытке скопировать */
  .fld.miss, .calc.miss { outline: 2px solid var(--err); outline-offset: 1px; background: var(--warn-bg); }
  /* Калькулятор {{NASCET}}: считает сам */
  .calc { font-weight: 700; color: var(--accent); }
  .calc.bad { color: var(--err); }
  /* Пульт «> …»: данные для расчётов, в копируемый текст не попадает */
  .ctl { margin: 2px 0 6px; padding: 4px 8px; border-left: 3px solid var(--warn); border-radius: 4px;
    background: var(--warn-bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 0.85rem; line-height: 1.9; }
  .ctl .calc { color: var(--warn); }
  .ctl summary { cursor: pointer; }
  /* ((…)) внутри фразы: поля для расчёта, на экране есть, в копию не идут */
  .hid { padding: 1px 5px; border-radius: 4px; background: var(--warn-bg); color: var(--warn);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 0.82rem; }
  .hid .calc { color: var(--warn); }
  /* Выпадающий список (позвонки) и выбор нескольких */
  select.sel { font: inherit; color: var(--accent); background: var(--head); border: 0; border-bottom: 1px dashed var(--accent);
    border-radius: 3px; padding: 0 1px; cursor: pointer; }
  select.sel:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ms-box { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
  .ms-box[hidden] { display: none; }
  .ms-chip, .ms-done { font: inherit; font-size: 0.85rem; line-height: 1.5; padding: 0 7px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  .ms-chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .ms-done { border-color: var(--accent); color: var(--accent); }
  .reset { height: 38px; padding: 0 10px; border: 0; background: transparent; color: var(--muted);
    font-size: 0.85rem; cursor: pointer; }
  .sheet-bar .btns { display: flex; gap: 4px; align-items: center; }
  /* Находки (tools/*.md): ввёл признаки — получил вывод и диф ряд, в заключение не копируется */
  .finding .sheet-bar { background: var(--warn-bg); color: var(--warn); }
  .fx { padding: 10px 14px 12px; font-size: 0.92rem; }
  .fx-intro { margin: 0 0 10px; color: var(--muted); font-size: 0.85rem; }
  .fx-form { display: flex; flex-direction: column; gap: 8px; }
  .fx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .fx-row[hidden] { display: none; }
  .fx-label { flex: 0 0 210px; color: var(--muted); font-size: 0.85rem; }
  .fx-num { width: 90px; height: 36px; padding: 0 8px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); }
  .fx-num:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .fx-opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .fx-opt { min-height: 34px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink); font-size: 0.85rem; cursor: pointer; text-align: left; }
  .fx-opt[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .fx-calc { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }
  .fx-calc:empty { display: none; }
  .fx-val b { color: var(--accent); }
  .fx-verdict { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--head); border-radius: 0 8px 8px 0; }
  .fx-h { margin: 14px 0 4px; font-size: 0.78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .fx-notes { margin: 0; }
  .fx-ddx { margin: 0; padding-left: 1.4em; }
  .fx-ddx li { margin: 6px 0; }
  .fx-ddx li.fx-down { opacity: .55; }
  .fx-dx { font-weight: 600; }
  .fx-must { margin-left: 8px; padding: 1px 6px; border-radius: 6px; font-size: 0.72rem; font-weight: 600;
    background: var(--warn-bg); color: var(--warn); }
  .fx-signs { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 0.82rem; }
  .fx-pro { color: var(--accent); }
  .fx-con { color: var(--err); }
  .fx-note { font-size: 0.82rem; color: var(--muted); }
  /* Источники находки: крупно и отдельно — инструмент работает только по ним */
  .fx-src { margin: 16px 0 0; padding: 12px 14px; border: 1.5px solid var(--accent); border-radius: 10px; background: var(--head); }
  .fx-src-h { font-size: 0.8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .fx-src ul { margin: 0; padding-left: 1.1em; }
  .fx-src li { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin: 4px 0; }
  .fx-src-n { margin-top: 8px; font-size: 0.82rem; color: var(--muted); }
  @media (max-width: 640px) { .fx-label { flex-basis: 100%; } }
  .study-hints > summary { display: inline-flex; align-items: center; gap: 12px; min-height: 44px;
    padding: 8px 14px; border: 1px solid var(--accent); border-radius: 10px;
    background: var(--card); background: color-mix(in srgb, var(--accent) 8%, var(--card));
    color: var(--accent); font-size: 0.9rem; font-weight: 600; list-style: none; cursor: pointer; }
  .study-hints > summary::-webkit-details-marker { display: none; }
  .study-hints > summary::after { content: ""; width: 7px; height: 7px;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: translateY(-2px) rotate(45deg); }
  .study-hints > summary:hover, .study-hints[open] > summary {
    background: var(--head); background: color-mix(in srgb, var(--accent) 15%, var(--card)); }
  .study-hints > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .study-hints[open] > summary::after { transform: translateY(2px) rotate(225deg); }
  .study-hints[open] > .hints { margin-top: 8px; }
  .measure-help-toggle {
    margin-inline-start: 6px; padding: 4px 9px; min-height: 28px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--card);
    color: var(--accent); font: 600 0.8rem/1.25 system-ui, sans-serif; cursor: pointer;
  }
  .measure-help-toggle:hover, .measure-help-toggle[aria-expanded="true"] { border-color: var(--accent); background: var(--head); }
  .measure-help-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (pointer: coarse) { .measure-help-toggle { min-height: 44px; } }
  .measure-help {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; max-width: 640px;
    margin: 6px 0 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--head); font: 0.875rem/1.45 system-ui, sans-serif; white-space: normal;
  }
  .measure-help[hidden] { display: none; }
  .measure-help img { display: block; width: 210px; max-width: 100%; border-radius: 8px; }
  .measure-help-copy { flex: 1 1 240px; }
  .measure-help-copy p { margin: 0 0 7px; }
  .measure-help-copy p:last-child { margin-bottom: 0; }
  .kl-guide { margin: 0 0 10px; font: 0.875rem/1.45 system-ui, sans-serif; white-space: normal; }
  .kl-guide .measure-help-toggle {
    display: inline-flex; align-items: center; gap: 9px; margin: 0; text-decoration: none;
  }
  .kl-guide summary { list-style: none; }
