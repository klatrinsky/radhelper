<script>
/* =====================================================================
   Менять этот файл не нужно.
   Тексты лежат в папке ru/, порядок разделов — в ru/order.txt.
   Шаблоны заключений — в папке templates/, порядок — в templates/order.txt.
   Находки («что я нашёл») — в папке tools/, порядок — в tools/order.txt, движок — assets/js/findings.js.
   Как оформлять тексты — см. docs/SYNTAX.md.
   ===================================================================== */
(function () {
  const DIR = "ru/";
  const listEl = document.getElementById("list");
  const noteEl = document.getElementById("note");
  const q = document.getElementById("q");
  const none = document.getElementById("none");

  if (location.protocol === "file:") {
    listEl.innerHTML = '<p class="err">Страница открыта как файл с диска, а браузер не даёт ей читать соседние файлы. ' +
      'Смотрите опубликованный сайт или откройте репозиторий через github.dev.</p>';
    return;
  }

  /* ---------- Мини-разметка: подмножество Markdown ---------- */
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function inline(s) {
    s = esc(s).replace(/&lt;br\s*\/?&gt;/gi, "<br>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  const cells = line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());

  function parse(text) {
    const lines = text.replace(/\r/g, "").split("\n");
    const out = { title: "", sub: "", html: "", who: "врач", words: "", sos: false, btn: true };
    let html = "", para = [], list = [], ltag = "ul";
    const flushP = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
    const flushL = () => { if (list.length) { html += "<" + ltag + ">" + list.map(x => "<li>" + inline(x) + "</li>").join("") + "</" + ltag + ">"; list = []; } };
    const flush = () => { flushP(); flushL(); };

    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i], t = raw.trim();
      if (!t) { flush(); continue; }
      if (/^# /.test(t) && !out.title) { flush(); out.title = t.slice(2).trim(); continue; }
      // служебные строки раздела: на экран не выводятся
      if (/^Для:/i.test(t)) { flush(); out.who = t.replace(/^Для:\s*/i, "").trim().toLowerCase().replace(/ё/g, "е"); continue; }
      if (/^Слова:/i.test(t)) { flush(); out.words += " " + t.replace(/^Слова:\s*/i, ""); continue; }
      // «Срочно: да» — экстренный раздел: красная рамка, у лаборанта — красная кнопка вверху главной и кнопка SOS
      if (/^Срочно:/i.test(t)) { flush(); out.sos = true; continue; }
      // «Кнопка: нет» — раздел без кнопки на главной лаборанта; находится только поиском
      if (/^Кнопка:/i.test(t)) { flush(); out.btn = !/^Кнопка:\s*нет/i.test(t); continue; }
      // «Позвонить: Код синий | +7 985 954-11-40» — большая кнопка звонка в одно касание
      if (/^Позвонить:/i.test(t)) {
        flush();
        const [who, num] = t.replace(/^Позвонить:\s*/i, "").split("|").map(s => s.trim());
        const tel = (num || who).replace(/[^\d+]/g, "");
        html += '<a class="call" href="tel:' + tel + '">📞 ' + (num ? esc(who) + ' · <span class="nw">' + esc(num) + "</span>" : '<span class="nw">' + esc(who) + "</span>") + "</a>";
        continue;
      }
      // калькулятор из assets/js/widgets.js: «Виджет: имя»
      if (/^Виджет:/i.test(t)) { flush(); html += '<div class="widget" data-widget="' + esc(t.replace(/^Виджет:\s*/i, "").trim()) + '"></div>'; continue; }
      if (/^##+ /.test(t)) { flush(); html += "<h3>" + inline(t.replace(/^##+ /, "")) + "</h3>"; continue; }
      if (/^> ?/.test(t) && !out.sub && !html) { flush(); out.sub = t.replace(/^> ?/, ""); continue; }
      if (t.startsWith("|")) {
        flush();
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
        i--;
        const head = cells(rows[0]);
        const body = rows.slice(1).filter(r => !/^\|?[\s:|-]+\|?$/.test(r)).map(cells);
        html += "<table><thead><tr>" + head.map(h => "<th>" + inline(h) + "</th>").join("") + "</tr></thead><tbody>" +
          body.map(r => "<tr>" + head.map((h, k) =>
            '<td data-label="' + esc(h) + '">' + inline(r[k] || "") + "</td>").join("") + "</tr>").join("") +
          "</tbody></table>";
        continue;
      }
      if (/^[-*] /.test(t)) { flushP(); if (ltag !== "ul") flushL(); ltag = "ul"; list.push(t.slice(2)); continue; }
      // нумерованный список: «1. Остановить введение»
      const ol = t.match(/^\d+[.)] (.*)$/);
      if (ol) { flushP(); if (ltag !== "ol") flushL(); ltag = "ol"; list.push(ol[1]); continue; }
      // картинка: ![подпись](img/файл.svg) — отдельной строкой
      const im = t.match(/^!\[([^\]]*)\]\(((?:img\/|https:\/\/)[^)\s]+)\)$/);
      if (im) { flush(); html += '<img class="pic" src="' + esc(im[2]) + '" alt="' + esc(im[1]) + '" loading="lazy">'; continue; }
      if (/^`[^`]+`$/.test(t)) { flush(); html += '<code class="formula">' + esc(t.slice(1, -1)) + "</code>"; continue; }
      if (/^(Источник|Radiopaedia):/.test(t)) { flush(); html += '<p class="src">' + inline(t) + "</p>"; continue; }
      flushL(); para.push(t);
    }
    flush();
    // две и больше картинок подряд — в ряд (на узком экране тоже)
    out.html = html.replace(/(?:<img class="pic"[^>]*>){2,}/g, m => '<div class="pics">' + m + "</div>");
    return out;
  }

  q.addEventListener("input", () => {
    if (!document.body.classList.contains("protocol-view")) return;
    document.body.classList.remove("protocol-view");
    const url = new URL(location.href);
    url.searchParams.delete("protocol");
    history.replaceState(null, "", url);
  });

  /* ---------- Загрузка ---------- */
  const get = f => fetch(DIR + f, { cache: "no-cache" }).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  });

  get("order.txt").then(txt => {
    const files = txt.split("\n").map(s => s.trim()).filter(s => s && !s.startsWith("#"));
    return Promise.all(files.map(f => get(f).then(t => ({ f, t }), () => ({ f, t: null }))));
  }).then(items => {
    listEl.innerHTML = "";
    const parsed = {};
    items.forEach(({ f, t }) => {
      if (t !== null) parsed[f.replace(/\.md$/i, "")] = t;
      if (t === null) {
        listEl.insertAdjacentHTML("beforeend", '<p class="err">Не найден файл ' + esc(DIR + f) + ' — проверьте имя в order.txt</p>');
        return;
      }
      const d = parse(t);
      // «Для:» врач (по умолчанию) / лаборант / оба — на чужом входе раздел не показываем
      if (d.who !== "оба" && d.who !== (window.RH_LAB ? "лаборант" : "врач")) return;
      if (f === "about.md") { noteEl.innerHTML = '<div class="note">' + d.html + "</div>"; return; }
      const sec = document.createElement("details");
      sec.className = d.sos ? "sec sos" : "sec";
      if (!d.btn) sec.dataset.nobtn = "1";
      sec.id = f.replace(/\.md$/i, "");
      sec.dataset.words = d.words;
      sec.innerHTML = "<summary><span class=\"t\">" + inline(d.title || f) + "</span>" +
        (d.sub ? '<span class="s">' + inline(d.sub) + "</span>" : "") + "</summary>" +
        '<div class="body">' + d.html +
        (d.sos ? '<button type="button" class="print-btn">🖨 Распечатать на стену</button>' : "") + "</div>";
      listEl.appendChild(sec);
    });
    listEl.querySelectorAll(".widget").forEach(el => {
      const fn = (window.RH_WIDGETS || {})[el.dataset.widget];
      if (fn) fn(el); else el.innerHTML = '<p class="err">Нет виджета «' + esc(el.dataset.widget) + '» в assets/js/widgets.js</p>';
    });
    setup();
    if (!window.RH_LAB) templates(parsed);   // шаблоны заключений лаборанту не нужны
  }).catch(() => {
    listEl.innerHTML = '<p class="err">Не удалось прочитать ru/order.txt.</p>';
    if (document.body.classList.contains("protocol-view")) templates({});
  });

  /* ---------- Поиск, «раскрыть всё», ссылки на раздел ---------- */
  function setup() {
    const secs = Array.from(document.querySelectorAll("details.sec"));
    // ё = е, ъ = ь: «обьем» найдёт «объём» (твёрдый знак на клавиатуре никто не помнит)
    const norm = s => s.toLowerCase().replace(/ё/g, "е").replace(/ъ/g, "ь");
    const texts = secs.map(s => norm(s.textContent + " " + (s.dataset.words || "")));

    q.addEventListener("input", () => {
      const wasHome = document.body.classList.contains("home");
      document.body.classList.toggle("home", !q.value.trim());
      if (wasHome && q.value.trim()) window.scrollTo(0, 0);
      const words = norm(q.value).split(/\s+/).filter(Boolean);
      let shown = 0;
      secs.forEach((s, i) => {
        const ok = words.every(w => texts[i].includes(w));
        s.hidden = !ok;
        s.open = ok && words.length > 0;      // найденное — сразу раскрыто
        if (ok) shown++;
      });
      none.hidden = shown > 0;
    });

    // Лаборант: на главной — кнопки всех разделов, чтобы не набирать слова руками
    if (window.RH_LAB) {
      // показать только выбранные разделы, раскрытыми
      const only = ids => {
        q.value = "";
        document.body.classList.remove("home");
        secs.forEach(s => { s.hidden = !ids.includes(s.id); s.open = !s.hidden; });
        none.hidden = true;
        history.replaceState(null, "", "#" + ids[0]);
        window.scrollTo(0, 0);
      };
      const btns = list => list.map(s => '<button type="button" data-id="' + s.id + '">' +
        s.querySelector("summary .t").innerHTML + "</button>").join("");
      const sos = secs.filter(s => s.classList.contains("sos"));
      const nav = document.getElementById("labLinks");
      nav.innerHTML = btns(secs.filter(s => !s.classList.contains("sos") && !s.dataset.nobtn));
      nav.hidden = false;
      const sosNav = document.getElementById("sosLinks");
      sosNav.innerHTML = btns(sos);
      sosNav.hidden = !sos.length;
      [nav, sosNav].forEach(n => n.addEventListener("click", e => {
        const b = e.target.closest("button"); if (b) only([b.dataset.id]);
      }));
      // SOS в углу на всех страницах, кроме главной: сразу все экстренные разделы
      document.getElementById("sosFab").addEventListener("click", () => only(sos.map(s => s.id)));

      // Прямые ссылки из новостей и переходы по истории внутри входа лаборанта.
      const openLinkedSection = () => {
        const id = location.hash.slice(1);
        if (secs.some(s => s.id === id)) only([id]);
        else if (!id) document.getElementById("homeBtn").click();
      };
      if (location.hash) openLinkedSection();
      window.addEventListener("hashchange", openLinkedSection);
    }

    // «Распечатать на стену»: печатается только этот раздел, раскрытым и крупно
    document.querySelectorAll("details.sec.sos .print-btn").forEach(b => b.addEventListener("click", () => {
      const sec = b.closest("details.sec");
      sec.open = true;
      sec.classList.add("print-me");
      document.body.classList.add("print-sos");
      window.print();
    }));
    window.addEventListener("afterprint", () => {
      document.body.classList.remove("print-sos");
      document.querySelectorAll(".print-me").forEach(s => s.classList.remove("print-me"));
    });


    // открытый раздел попадает в адрес — ссылкой можно поделиться
    secs.forEach(s => s.addEventListener("toggle", () => {
      if (s.open && !q.value) history.replaceState(null, "", "#" + s.id);
    }));
    const target = !window.RH_LAB && location.hash && document.getElementById(location.hash.slice(1));
    if (!document.body.classList.contains("protocol-view") && target && target.tagName === "DETAILS") { target.open = true; target.scrollIntoView(); }
  }

  /* ---------- Шаблоны заключений ---------- */
  const TDIR = "templates/";
  const studyEl = document.getElementById("study");
  const toastEl = document.getElementById("toast");
  const lower = s => s.toLowerCase().replace(/ё/g, "е");
  const tokens = s => lower(s).replace(/[^a-zа-я0-9]+/g, " ").split(" ").filter(Boolean);
  // слова, без которых запрос не меняется: «кт органов грудной клетки» = «грудной клетки»
  const STOP = new Set(["кт", "мскт", "органов", "орган", "органы", "исследование", "описание", "и", "с", "без"]);
  const stem = w => w.length > 4 ? w.slice(0, w.length - 2) : w;

  function readTemplate(f, t) {
    const lines = t.replace(/\r/g, "").split("\n");
    const cut = lines.findIndex(l => l.trim() === "---");
    if (cut < 0) return null;
    const meta = {};
    lines.slice(0, cut).forEach(l => {
      const m = l.match(/^\s*([^:#]+):\s*(.*)$/);
      if (m) meta[lower(m[1].trim())] = m[2].trim();
    });
    const text = lines.slice(cut + 1).join("\n").replace(/^\n+|\s+$/g, "");
    const study = meta["исследование"];
    if (!study || !text) return null;
    // Автономный интерактивный инструмент: ссылка вместо обычного копируемого шаблона.
    // Только страницы внутри репозитория, никаких внешних адресов и ../
    const page = meta["страница"] || "";
    if (page && !/^[a-z0-9_-]+\.html$/i.test(page)) return null;
    return {
      f, study, text, kind: page ? "page" : "template", page,
      variant: meta["вариант"] || "Основной",
      modality: meta["модальность"] || "",
      alert: meta["внимание"] || "",
      hints: (meta["подсказки"] || "").split(/[,\s]+/).map(s => s.replace(/\.md$/i, "")).filter(Boolean),
      words: tokens([study, meta["вариант"], meta["модальность"], meta["слова"]].join(" "))
    };
  }

  // Находка (tools/*.md): та же шапка, но «Находка:» вместо «Исследование:»
  function readTool(f, t) {
    const lines = t.replace(/\r/g, "").split("\n");
    const cut = lines.findIndex(l => l.trim() === "---");
    if (cut < 0 || !window.RH_FINDINGS) return null;
    const meta = {};
    lines.slice(0, cut).forEach(l => {
      const m = l.match(/^\s*([^:#]+):\s*(.*)$/);
      if (m) meta[lower(m[1].trim())] = m[2].trim();
    });
    const title = meta["находка"];
    if (!title) return null;
    return {
      f, study: title, text: "", kind: "tool",
      tool: window.RH_FINDINGS.parse(lines.slice(cut + 1).join("\n")),
      variant: "Находка",
      modality: "Находка" + (meta["модальность"] ? " · " + meta["модальность"] : ""),
      hints: (meta["подсказки"] || "").split(/[,\s]+/).map(s => s.replace(/\.md$/i, "")).filter(Boolean),
      words: tokens([title, meta["модальность"], meta["слова"]].join(" "))
    };
  }

  function score(words, v) {
    let s = 0;
    for (const w of words) {
      const st = stem(w);
      if (v.words.includes(w)) s += 2;          // точное слово весит больше частичного
      else if (v.words.some(k => k.startsWith(st) || (k.length > 3 && st.startsWith(k)))) s++;
      else return 0;
    }
    return s;
  }

  const protocolId = v => v.f.replace(/\.md$/i, "");
  function protocolUrl(v) {
    if (v.kind === "page") return new URL(v.page, location.href);
    const url = new URL(location.pathname, location.origin);
    url.searchParams.set("protocol", protocolId(v));
    return url;
  }

  function templates(sections) {
    const readList = (dir, read) => fetch(dir + "order.txt", { cache: "no-cache" })
      .then(r => r.ok ? r.text() : "").then(txt => {
        const files = txt.split("\n").map(s => s.trim()).filter(s => s && !s.startsWith("#"));
        return Promise.all(files.map(f => fetch(dir + f, { cache: "no-cache" })
          .then(r => r.ok ? r.text() : null).then(t => t === null ? null : read(f, t), () => null)));
      }, () => []);
    Promise.all([readList(TDIR, readTemplate), readList("tools/", readTool)]).then(([tl, fl]) => {
      const list = tl.concat(fl);
      const variants = list.filter(Boolean);
      const studies = [];
      variants.forEach(v => {
        let s = studies.find(x => x.title === v.study);
        if (!s) { s = { title: v.study, modality: v.modality, variants: [] }; studies.push(s); }
        s.variants.push(v);
      });
      const hintCache = {};
      const hint = name => {
        if (sections[name] !== undefined) return Promise.resolve(sections[name]);
        if (!hintCache[name]) hintCache[name] = get(name + ".md").catch(() => null);
        return hintCache[name];
      };


      // Keep the live form and its calculation state together for each variant.
      const forms = new Map();
      let undoReset = null;
      let current = null;
      function show(found, words, keep) {
        if (!found.length) { studyEl.hidden = true; studyEl.innerHTML = ""; current = null; return; }
        if (!keep || !found.includes(current)) current = found[0];
        const s = current;
        let vi = 0, best = -1;
        s.variants.forEach((v, i) => { const sc = score(words, v); if (sc > best) { best = sc; vi = i; } });
        render(found, s, vi);
      }
      function render(found, s, vi) {
        current = s;
        const v = s.variants[vi];
        studyEl.hidden = false;
        if (document.body.classList.contains("protocol-view") && v.kind === "template") {
          const url = new URL(location.href);
          url.searchParams.set("protocol", protocolId(v));
          history.replaceState(null, "", url);
        }
        studyEl.dataset.src = (v.kind === "tool" ? "tools/" : TDIR) + v.f;
        studyEl.innerHTML =
          (found.length > 1 ? '<div class="picks">' + found.map((x, i) =>
            '<button type="button" class="pick" data-i="' + i + '" aria-pressed="' + (x === s) + '">' + esc(x.title) + "</button>").join("") + "</div>" : "") +
          '<div><h2>' + esc(s.title) + "</h2>" +
          (s.modality || v.kind !== "tool" ? '<div class="study-meta">' +
            (s.modality ? "<span>" + esc(s.modality) + "</span>" : "") +
            (v.kind === "tool" ? "" : '<button type="button" class="share-protocol">Скопировать ссылку</button>') +
            "</div>" : "") + "</div>" +
          (s.variants.length > 1 ? '<div class="tabs" role="tablist">' + s.variants.map((x, i) =>
            '<button type="button" class="tab" role="tab" data-v="' + i + '" aria-selected="' + (i === vi) + '">' + esc(x.variant) + "</button>").join("") + "</div>" : "") +
          (v.kind === "tool"
            ? '<div class="sheet finding"><div class="sheet-bar"><span>Повод задуматься · в заключение не копируется</span>' +
              '<span class="btns"><button type="button" class="reset">Сбросить</button></span></div><div class="fx"></div></div>'
            : v.kind === "page"
            ? '<div class="sheet"><div class="sheet-bar"><span>Интерактивный конструктор · отдельная страница Radhelper</span></div>' +
              '<div class="app-entry"><p>' + inline(v.text) + '</p><a href="' + esc(v.page) + '">Открыть конструктор переломов →</a></div></div>'
            : (v.alert ? '<div class="alert">' + esc(v.alert) + '</div>' : "") +
              '<div class="sheet"><div class="sheet-bar actions">' +
              '<span class="btns"><button type="button" class="reset">Сбросить</button>' +
              '<button type="button" class="copy">Скопировать</button></span></div><div class="tpl"></div></div>') +
          (v.hints.length ? '<details class="study-hints"><summary>Подсказки</summary><div class="hints"></div></details>' : "");
        const share = studyEl.querySelector(".share-protocol");
        if (share) share.onclick = () => copy(protocolUrl(v).href);
        if (v.kind === "tool") window.RH_FINDINGS.render(v.tool, studyEl.querySelector(".fx"));
        let tpl = null;
        const slot = studyEl.querySelector(".tpl");
        if (slot) {
          let form = forms.get(v);
          if (form) slot.replaceWith(form.root);
          else {
            form = { root: slot, api: buildTemplate(v.text, slot) };
            forms.set(v, form);
          }
          tpl = form.api;
        }
        studyEl.querySelectorAll(".pick").forEach(b => b.onclick = () => render(found, found[+b.dataset.i], 0));
        studyEl.querySelectorAll(".tab").forEach(b => b.onclick = () => render(found, s, +b.dataset.v));
        if (tpl) {
          let armed = 0;                                          // время первого нажатия при незаполненных полях
          const btn = studyEl.querySelector(".copy");
          btn.onclick = () => {
            const miss = tpl.missing();
            studyEl.querySelectorAll(".miss").forEach(e => e.classList.remove("miss"));
            if (!miss.length || Date.now() - armed < 8000) { armed = 0; btn.textContent = "Скопировать"; copy(tpl.text()); return; }
            armed = Date.now();
            const names = [...new Set(miss.map(m => m.label))];
            miss.forEach(m => m.el.classList.add("miss"));
            const first = miss.find(m => m.el.tagName === "INPUT");
            if (first) { first.el.focus({ preventScroll: true }); first.el.scrollIntoView({ block: "center", behavior: "smooth" }); }
            btn.textContent = "Всё равно скопировать";
            toast("Не заполнено: " + names.slice(0, 4).join(", ") + (names.length > 4 ? " и ещё " + (names.length - 4) : ""), 4000);
            setTimeout(() => { if (armed && Date.now() - armed >= 8000) { armed = 0; btn.textContent = "Скопировать"; } }, 8100);
          };
          // начал заполнять — подсветка с этого поля уходит
          studyEl.querySelector(".tpl").addEventListener("input", e => e.target.classList.remove("miss"));
        }
        const reset = studyEl.querySelector(".reset");
        if (reset) reset.onclick = () => {
          if (tpl) {
            undoReset = { variant: v, form: forms.get(v) };
            forms.delete(v);
          }
          render(found, s, vi);
        };
        if (undoReset && undoReset.variant === v) {
          const undo = document.createElement("button");
          undo.type = "button";
          undo.textContent = "Отменить сброс";
          reset.after(undo);
          undo.onclick = () => {
            forms.set(v, undoReset.form);
            undoReset = null;
            render(found, s, vi);
          };
        }
        const box = studyEl.querySelector(".hints");
        if (box) Promise.all(v.hints.map(hint)).then(texts => {
          if (current !== s || !box.isConnected) return;
          texts.forEach((t, i) => {
            const d = document.createElement("details");
            d.className = "sec";
            if (t === null) { box.insertAdjacentHTML("beforeend", '<p class="err">Нет подсказки ' + esc(DIR + v.hints[i]) + '.md — проверьте строку «Подсказки:» в ' + esc(TDIR + v.f) + "</p>"); return; }
            const p = parse(t);
            d.innerHTML = "<summary><span class=\"t\">" + inline(p.title || v.hints[i]) + "</span>" +
              (p.sub ? '<span class="s">' + inline(p.sub) + "</span>" : "") + "</summary>" +
              '<div class="body">' + p.html + "</div>";
            if (i === 0) d.open = true;
            box.appendChild(d);
          });
        });
      }

      q.addEventListener("input", () => {
        if (!q.value.trim()) { forms.clear(); undoReset = null; }
        const words = tokens(q.value).filter(w => !STOP.has(w));
        if (!words.length) { show([], words); return; }
        const found = studies.map(s => ({ s, sc: Math.max(...s.variants.map(v => score(words, v))) }))
          .filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).map(x => x.s);
        show(found, words, true);
        if (found.length) none.hidden = true;
      });
      if (q.value) q.dispatchEvent(new Event("input"));
      else if (document.body.classList.contains("protocol-view")) {
        const id = new URLSearchParams(location.search).get("protocol");
        const study = studies.find(s => s.variants.some(v => v.kind !== "tool" && protocolId(v) === id));
        if (study) {
          const vi = study.variants.findIndex(v => v.kind !== "tool" && protocolId(v) === id);
          render([study], study, vi);
        } else {
          studyEl.innerHTML = '<p class="empty" role="status">Шаблон по этой ссылке не найден. Воспользуйтесь поиском.</p>';
          studyEl.hidden = false;
        }
      }
    }).catch(() => { /* нет папки templates — сайт работает как раньше */ });
  }
  const get_t = f => fetch(TDIR + f, { cache: "no-cache" }).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  });

  function addKellgrenGuide(el, joint) {
    const knee = joint === "колено";
    const folder = knee ? "kellgren-knee" : "kellgren-hip";
    const anatomy = knee ? "коленного сустава" : "тазобедренного сустава";
    const source = knee
      ? 'D. J. Solomon, P. McLoughlin. <a href="https://assets.cureus.com/uploads/original_article/pdf/420801/20251029-207681-fherkc.pdf#page=3" target="_blank" rel="noopener">Cureus, 2025, рис. 1–5</a> · Размер снимков уменьшен.'
      : 'R. M. Huzum и соавт. <a href="https://mdpi-res.com/d_attachment/diagnostics/diagnostics-15-01932/article_deploy/diagnostics-15-01932.pdf?version=1753970717#page=5" target="_blank" rel="noopener">Diagnostics, 2025, рис. 2</a> · Панели разделены на отдельные снимки.';
    const figures = Array.from({ length: 5 }, (_, grade) => {
      const src = "img/" + folder + "/kl-" + grade + ".jpg";
      const alt = "Рентгенограмма " + anatomy + ", степень " + grade;
      return '<figure><button type="button" class="kl-zoom" aria-haspopup="dialog" aria-label="Увеличить снимок: степень ' + grade +
        '"><img src="' + src + '" loading="lazy" alt="' + alt + '"></button><figcaption>Степень ' + grade + '</figcaption></figure>';
    }).join("");
    addImageGuide(el, "Сравнить степени Келлгрена — Лоуренса", figures, source);
  }

  function addPostopGuide(el, hip) {
    const images = hip ? [
      ["hip-7.jpg", "Цементная чашка. Треугольные метки указывают на цементную мантию вокруг вертлужного компонента."],
      ["hip-4.jpg", "Бесцементная чашка (press-fit). Металлическая оболочка прилежит к ложу без цементной мантии."],
      ["hip-6.jpg", "Бесцементная чашка с винтом. Винт проходит из чашки в подвздошную кость. Цемент вокруг ножки относится к бедренному компоненту."]
    ] : [
      ["scarf-akin.jpg", "Scarf и Akin на одном снимке. Чёрные стрелки указывают на фиксацию I плюсневой кости после Scarf, белая — на остеотомию проксимальной фаланги I пальца по Akin."],
      ["weil.jpg", "Пример подголовчатой остеотомии по Weil. Чёрные стрелки указывают на винты в дистальном отделе II плюсневой кости. Белая стрелка отмечает отдельное вмешательство на пальце."]
    ];
    const figures = images.map(([file, caption]) =>
      '<figure><button type="button" class="kl-zoom" aria-haspopup="dialog" aria-label="Увеличить: ' +
      caption + '"><img src="img/postop/' + file + '" loading="lazy" alt="' + caption +
      '"></button><figcaption>' + caption + '</figcaption></figure>').join("");
    const source = hip
      ? 'J. Vanrusselt и соавт. <a href="https://doi.org/10.1007/s13244-015-0438-5" target="_blank" rel="noopener">Insights into Imaging, 2015, рис. 7, 4 и 6</a>.'
      : 'M. Soltanolkotabi и соавт. <a href="https://doi.org/10.3390/diagnostics12051090" target="_blank" rel="noopener">Diagnostics, 2022, рис. 3B и 4B</a>. Панели выделены и уменьшены.';
    addImageGuide(el, hip ? "Как различить фиксацию чашки?" : "Как выглядят остеотомии?", figures, source);
  }

  function addTemporalGuide(el) {
    const images = [
      ["middle-ear.png", "Среднее ухо. A–C: сохранная шпора, воздушный эпитимпанум и сочленение наковальни со стременем. D–I: примеры холестеатомы и хронического отита."],
      ["inner-ear.jpg", "Внутреннее ухо и канал лицевого нерва. На аксиальных срезах отмечены улитка, преддверие, полукружные каналы, внутренний слуховой проход (IAC) и сегменты канала VII нерва."],
      ["tegmen-labyrinth.png", "Эрозии при холестеатоме. A–B: латеральный полукружный канал, C: крыша барабанной полости, D: базальный завиток улитки."]
    ];
    const figures = images.map(([file, caption]) =>
      '<figure><button type="button" class="kl-zoom" aria-haspopup="dialog" aria-label="Увеличить: ' +
      caption + '"><img src="img/temporal/' + file + '" loading="lazy" alt="' + caption +
      '"></button><figcaption>' + caption + '</figcaption></figure>').join("");
    const source = 'P. Touska, S. E. J. Connor. <a href="https://link.springer.com/article/10.1007/s00330-024-11021-x#Fig1" target="_blank" rel="noopener">European Radiology, 2025, рис. 1</a> и <a href="https://link.springer.com/article/10.1007/s00330-024-11021-x#Fig3" target="_blank" rel="noopener">рис. 3</a>. ' +
      'P. Feraco, S. Piccinini, C. Gagliardo. <a href="https://link.springer.com/article/10.1007/s11547-021-01387-z#Fig3" target="_blank" rel="noopener">La Radiologia Medica, 2021, рис. 3</a>.';
    addImageGuide(el, "Ориентиры на КТ височных костей", figures, source, "Увеличенный снимок КТ");
  }

  function addImageGuide(el, title, figures, source, imageLabel = "Увеличенная рентгенограмма") {
    const guide = document.createElement("details");
    guide.className = "kl-guide";
    guide.innerHTML = '<summary class="measure-help-toggle">' + title + '</summary>' +
      '<div class="kl-panel"><div class="kl-images">' + figures + '</div>' +
      '<p class="kl-source">' + source + ' <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></p></div>' +
      '<dialog class="kl-viewer" aria-label="' + imageLabel + '">' +
      '<div class="kl-viewer-bar"><strong></strong><button type="button" class="measure-help-toggle" autofocus>Закрыть</button></div><img alt=""></dialog>';
    const dialog = guide.querySelector("dialog");
    const enlarged = dialog.querySelector("img");
    guide.querySelectorAll(".kl-zoom").forEach(button => {
      button.addEventListener("click", () => {
        const image = button.querySelector("img");
        dialog.querySelector("strong").textContent = button.parentElement.querySelector("figcaption").textContent;
        enlarged.src = image.getAttribute("src");
        enlarged.alt = image.alt;
        dialog.showModal();
      });
    });
    dialog.querySelector("button").addEventListener("click", () => dialog.close());
    enlarged.addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
    el.append(guide);
  }

  function addEvansGuide(fields) {
    // Кнопка стоит снаружи переключателя «Желудочки».
    const control = fields[0].closest(".tg");
    const line = control?.closest(".ln");
    if (!line) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "measure-help-toggle";
    button.textContent = "Как измерить?";
    button.setAttribute("aria-label", "Как измерить индекс Эванса?");
    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-controls", "evans-guide");
    control.after(button);

    const panel = document.createElement("div");
    panel.id = "evans-guide";
    panel.className = "measure-help";
    panel.hidden = true;
    panel.innerHTML = '<img src="img/evans-index.svg" width="210" height="175" loading="lazy" alt="Схема аксиального среза с линиями A и B">' +
      '<div class="measure-help-copy"><p><strong>Индекс Эванса = A / B</strong></p>' +
      '<p><b>A</b> — максимальная ширина передних рогов боковых желудочков.</p>' +
      '<p><b>B</b> — максимальный внутренний поперечник черепа на том же аксиальном срезе.</p>' +
      '<p><a href="https://doi.org/10.2176/nmc.st.2020-0292">Источник методики</a></p></div>';
    line.after(panel);
    button.addEventListener("click", () => {
      panel.hidden = !panel.hidden;
      button.setAttribute("aria-expanded", String(!panel.hidden));
    });
  }

  /* ---------- Умные шаблоны: переключатели, поля, калькуляторы ----------
     В тексте шаблона:
       {нет|умеренный|выраженный}  — переключатель, первый вариант по умолчанию
       {#сердце: а|б}              — именованный: все {#сердце: ...} переключаются вместе
       {|фраза}                    — пустой вариант; строка из одних пустых при копировании убирается
       [__]                        — пустое поле
       [правой]                    — поле с текстом по умолчанию
       [Dмин]                      — поле для калькулятора (имя из списка CALC ниже)
       {{NASCET}}                  — посчитанное значение; можно и внутри переключателя:
                                     {норма|расширена, КТИ {{КТИ}}%}
       {{ПЕРЕЧЕНЬ: L4–L5, L5–S1 | 2 | Протрузия диска *. | Протрузии дисков *.}}
                                   — склейка: имена переключателей {#L4–L5: ...}, у которых выбран вариант №2,
                                     через запятую вместо *; одно — первая фраза, несколько — вторая; ни одного — строки нет
                                     (5-я фраза — ни одного, 6-я — все; «имя=подпись» — в текст идёт подпись)
       {{ВСЕ: а, б | 1 | фраза}}   — фраза, только если у всех переключателей выбран вариант №1
       {#позвонок: L1|L2|L3|L4|L5} — 5+ коротких вариантов без полей — выпадающий список; «+L3» — по умолчанию
       {*имя: +L4–L5|L5–S1}        — выбор нескольких, в текст через запятую
       [#имя] / [#имя = текст]     — связанное поле: все [#имя] заполняются вместе
       ((текст [поле]))            — видно на экране, в копию не идёт
  */

  const PH_MM = [];                                   // поля, где в пустом поле вместо имени подсказка «мм»
  // Калькуляторы. Чтобы добавить свой: имя, какие поля нужны, формула и сколько знаков после запятой.
  const CALC = {
    "MEYERDING": { inputs: ["Смещение"], text: percent =>
      percent <= 25 ? "I" : percent <= 50 ? "II" : percent <= 75 ? "III" : percent <= 100 ? "IV" : "V" },
    "NASCET": { inputs: ["Dмин", "Dдист"], digits: 0,
      f: (dmin, ddist) => (1 - dmin / ddist) * 100 },
    "ECST":   { inputs: ["Dмин", "Dлук"],  digits: 0,
      f: (dmin, dbulb) => (1 - dmin / dbulb) * 100 },
    "ОБЪЁМ":  { inputs: ["Длина", "Ширина", "Высота"], digits: 1,      // эллипсоид, мм → мл
      f: (a, b, c) => 0.523 * a * b * c / 1000 },
    "КТИ":    { inputs: ["Сердце", "Грудь"], digits: 0,               // кардиоторакальный индекс, %
      f: (heart, chest) => heart / chest * 100 },
    "ВЫВОД АОРТА": { inputs: ["Диаметр восходящей аорты"], uses: ["аорта"], raw: true, optional: true,
      text: ([d], tg) => tg("аорта") === 1 && Number.isFinite(d) && d > 40 ? "Расширение восходящей аорты." : "" },
    "ВЫВОД ЛЁГОЧНЫЙ СТВОЛ": { inputs: ["Диаметр лёгочного ствола"], uses: ["лёгочный ствол"], raw: true, optional: true,
      text: ([d], tg) => tg("лёгочный ствол") === 1 && Number.isFinite(d) && d > 30 ? "Косвенные признаки лёгочной гипертензии." : "" },
    "ЭВАНС":  { inputs: ["Рога", "Череп"], digits: 2,                 // индекс Эванса: передние рога / внутренний поперечник черепа
      f: (horns, skull) => horns / skull,
      // сам ставит переключатель {#желудочки: норма|расширены}: > 0,3 — второй вариант
      toggle: "желудочки", pick: x => x > 0.3 ? 1 : 0 },
    // поле называется «L1 HU», а не «L1»: иначе [L1] в «Снижение высоты тела [L1] позвонка» становилось полем плотности
    "L1 HU":  { inputs: ["L1 HU"], digits: 0,                         // плотность тела L1, HU (Pickhardt 2013)
      f: hu => hu,
      // сам ставит переключатель {#остеопороз: |...}: ≤ 110 HU — второй вариант (фраза в описании и строка в заключении)
      // reset: поле стёрли — переключатель возвращается к первому варианту (фразы нет)
      toggle: "остеопороз", pick: x => x <= 110 ? 1 : 0, reset: true },
    "ADI":    { inputs: ["ADI"], digits: 1,                           // атлантодентальный интервал на КТ, мм (норма у взрослых ≤ 2 мм, Rojas 2007)
      f: adi => adi,
      toggle: "ADI", pick: x => x > 2 ? 1 : 0 }
  };

  // Планиметрическая площадь дурального мешка на уровне диска, мм² (Schönström 1985): > 100 — норма, 75–100 — относительный стеноз, < 75 — абсолютный.
  // Для каждого уровня — поле [S L4–L5] и калькулятор {{S L4–L5}}; он сам ставит {#стеноз L4–L5: |относительный|абсолютный}.
  // Стеноз ВСА по сторонам: поля [Dмин П] [Dдист П] [Dлук П] (и Л), калькуляторы {{NASCET П}}, {{ECST П}}.
  // NASCET сам ставит {#градация П: незначимый|умеренный|выраженный}: < 50% — 0, 50–69% — 1, ≥ 70% — 2.
  ["П", "Л"].forEach(side => {
    CALC["NASCET " + side] = { inputs: ["Dмин " + side, "Dдист " + side], digits: 0,
      f: (dmin, ddist) => dmin > 0 && ddist > 0 ? Math.max(0, 1 - dmin / ddist) * 100 : NaN,
      toggle: "градация " + side, pick: x => x < 50 ? 0 : x < 70 ? 1 : 2, reset: true };
    CALC["ECST " + side] = { inputs: ["Dмин " + side, "Dлук " + side], digits: 0,
      f: (dmin, dbulb) => dmin > 0 && dbulb >= dmin ? (1 - dmin / dbulb) * 100 : NaN };
  });

  // Компрессионный перелом: снижение высоты тела позвонка, % = (1 − снижённая / должная) × 100, и степень по Genant (1993):
  // < 20% — 0 (не перелом: в тексте «нельзя исключить грыжу Шморля»), 20–25% — 1, 25–40% — 2, > 40% — 3. Поля [h 1] (снижённая, мм) и [H 1] (должная: задний отдел
  // того же тела или соседний неизменённый позвонок, мм); калькуляторы {{ВЫСОТА 1}} и {{GENANT 1}}. Номера 1–3 — до трёх позвонков.
  const genant = x => x < 20 ? "0" : x <= 25 ? "1" : x <= 40 ? "2" : "3";
  const loss = (h, H) => (1 - h / H) * 100;
  [1, 2, 3].forEach(i => {
    // < 20% — по Genant не перелом: сам ставит {#Шморль 1: перелом|нельзя исключить грыжу Шморля}
    CALC["ВЫСОТА " + i] = { inputs: ["h " + i, "H " + i], digits: 0, f: loss,
      toggle: "Шморль " + i, pick: x => x < 20 ? 1 : 0, reset: true };
    CALC["GENANT " + i] = { inputs: ["h " + i, "H " + i], text: (h, H) => h <= H ? genant(Math.round(loss(h, H))) : "" };
    PH_MM.push("h " + i, "H " + i);
  });

  ["L1–L2", "L2–L3", "L3–L4", "L4–L5", "L5–S1"].forEach(lvl => {
    CALC["S " + lvl] = { inputs: ["S " + lvl], digits: 0, f: s => s,
      toggle: "стеноз " + lvl, pick: x => x < 75 ? 2 : x <= 100 ? 1 : 0, reset: true, pickRaw: true };
  });

  // КТ-перфузия: межполушарные отношения по бассейнам. Поля [СМА CBF П] и [СМА CBF Л] (и ПМА, ЗМА; CBF, CBV, MTT),
  // калькуляторы {{СМА CBF П/Л}} и {{СМА CBF Л/П}} — в шаблоне стоят внутри переключателя {#сторона: …}, копируется видимый.
  ["ПМА", "СМА", "ЗМА"].forEach(t => ["CBF", "CBV", "MTT"].forEach(m => {
    const r = t + " " + m + " П", l = t + " " + m + " Л";
    CALC[t + " " + m + " П/Л"] = { inputs: [r, l], digits: 2, f: (a, b) => a / b };
    CALC[t + " " + m + " Л/П"] = { inputs: [l, r], digits: 2, f: (a, b) => a / b };
  }));

  // КТ-перфузия, бассейн СМА: вывод «асимметрия есть / нет» и её описание — по отношениям сторона стеноза / противоположная.
  // Порог: отношение вне 0,90–1,10 хотя бы по одному параметру (Waaijer 2007: нормальная разница право/лево ± 10%).
  const r2 = (a, b) => Math.round(a / b * 100) / 100;
  const off = x => x < 0.9 || x > 1.1;
  function perfText(cbf, cbv, mtt) {                       // отношения → «снижение CBF (0,78), удлинение MTT (1,29) без значимого изменения CBV»
    const ch = [], same = [];
    [["CBF", cbf, "снижение", "повышение"], ["CBV", cbv, "снижение", "повышение"], ["MTT", mtt, "укорочение", "удлинение"]]
      .forEach(([n, x, down, up]) => off(x) ? ch.push((x < 1 ? down : up) + " " + n + " (" + fmt(x, 2) + ")") : same.push(n));
    if (!ch.length) return "";
    return ch.join(", ") + (same.length ? " без значимого изменения " + same.join(" и ") : "");
  }
  const SMA = ["СМА CBF П", "СМА CBV П", "СМА MTT П", "СМА CBF Л", "СМА CBV Л", "СМА MTT Л"];
  const smaRatios = (v, side) => side === 0                 // 0 — стеноз справа (П/Л), 1 — слева (Л/П)
    ? [r2(v[0], v[3]), r2(v[1], v[4]), r2(v[2], v[5])]
    : [r2(v[3], v[0]), r2(v[4], v[1]), r2(v[5], v[2])];
  CALC["СМА КАРТИНА П/Л"] = { inputs: SMA, text: (...v) => perfText(...smaRatios(v, 0)) };
  CALC["СМА КАРТИНА Л/П"] = { inputs: SMA, text: (...v) => perfText(...smaRatios(v, 1)) };
  // Невидимый: сам ставит {#СМА: не введено|асимметрии нет|асимметрия}. Пересчитывается и при смене {#сторона: …}.
  CALC["СМА ВЫВОД"] = { inputs: SMA, hidden: true, uses: ["сторона"],
    set: (v, tg) => {
      if (!v.every(x => isFinite(x) && x > 0)) return { "СМА": 0 };
      return { "СМА": smaRatios(v, tg("сторона")).some(off) ? 2 : 1 };
    } };

  /* Денситометрия (DXA). Поля по областям: [T позв] [T% позв] [Z позв] [Z% позв] — и так же «шейка 1», «шейка 2», «предпл».
     «шейка 2» — контралатеральная шейка; [было …] — прошлое значение в % T- или Z-критерия (по пациенту).
     Критерий: женщина после менопаузы или мужчина ≥ 50 лет — T; женщина до менопаузы или мужчина < 50 — Z.
     Диагноз — по худшему значению среди видимых областей (Total Body не участвует):
       T ≥ −1,0 — норма; −2,5 < T < −1,0 — остеопения; T ≤ −2,5 — остеопороз; Z > −2,0 — в пределах ожидаемых, Z ≤ −2,0 — ниже.
     Сравнение с прошлым исследованием: разница T% или Z% в процентных пунктах либо изменение МПК в процентах. */
  const DXA = [   // область: поля, переключатель «есть / нет области», как назвать в тексте
    { k: "позв",    show: "поясничный отдел", where: tg => "в поясничном отделе позвоночника" },
    { k: "шейка 1", show: "шейка бедра",      where: tg => "в шейке " + (tg("бедро") ? "правой" : "левой") + " бедренной кости" },
    { k: "шейка 2", show: "контралатеральная шейка", hiddenFirst: true,
      where: tg => "в шейке " + (tg("бедро") ? "левой" : "правой") + " бедренной кости" },
    { k: "предпл",  show: "предплечье", hiddenFirst: true, where: tg => "в области " + (tg("рука") ? "правого" : "левого") + " предплечья" }
  ];
  const DXA_IN = ["Возраст"].concat(DXA.flatMap(r => ["T " + r.k, "T% " + r.k, "Z " + r.k, "Z% " + r.k, "было " + r.k, "BMD " + r.k, "BMD было " + r.k]));
  const DXA_USES = ["пол", "менопауза", "TBS", "бедро", "рука", "режим динамики", "контроль"].concat(DXA.map(r => r.show));
  const PH = { "Смещение": "__", "Возраст": "__", "FRAX осн": "%", "L1 HU": "HU", "Диаметр восходящей аорты": "__", "Диаметр лёгочного ствола": "__" };                    // подсказка в пустом поле вместо имени
  PH_MM.forEach(n => { PH[n] = "мм"; });
  DXA.forEach(r => Object.assign(PH, { ["T " + r.k]: "T", ["T% " + r.k]: "%", ["Z " + r.k]: "Z", ["Z% " + r.k]: "%", ["было " + r.k]: "%", ["BMD " + r.k]: "г/см²", ["BMD было " + r.k]: "г/см²" }));
  const r1 = x => Math.round(x * 10) / 10;                         // сравниваем с порогами по одному знаку, как в протоколе
  function dxa(v, tg) {                                             // v — значения полей в порядке DXA_IN
    const get = n => v[DXA_IN.indexOf(n)];
    const woman = tg("пол") === 0, age = get("Возраст");
    const crit = woman ? (tg("менопауза") === 0 ? "T" : "Z") : isFinite(age) ? (age >= 50 ? "T" : "Z") : null;
    const regions = DXA.filter(r => tg(r.show) === (r.hiddenFirst ? 1 : 0));   // видимые области
    return { crit, age, regions, get };
  }
  function dxaChanges({ crit, regions, get }, tg, bmdMode) {
    if (!bmdMode && !crit) return [];
    const res = [];
    regions.forEach(r => {
      let d;
      if (bmdMode) {
        const now = get("BMD " + r.k), was = get("BMD было " + r.k);
        if (!(Number.isFinite(now) && Number.isFinite(was) && now > 0 && was > 0)) return;
        d = (now - was) / was * 100;
      } else {
        const now = get(crit + "% " + r.k), was = get("было " + r.k);
        if (!Number.isFinite(now) || !Number.isFinite(was)) return;
        d = now - was;
      }
      if (Number.isFinite(d)) res.push({ d, where: r.where(tg) });
    });
    return res;
  }
  const MONTHS = ["январе", "феврале", "марте", "апреле", "мае", "июне", "июле", "августе", "сентябре", "октябре", "ноябре", "декабре"];
  const inYears = n => () => { const d = new Date(); return MONTHS[d.getMonth()] + " " + (d.getFullYear() + n); };
  Object.assign(CALC, {
    // текстовые калькуляторы с raw: получают все значения (и пустые, и отрицательные) и состояние переключателей
    "КРИТЕРИЙ": { inputs: DXA_IN, raw: true, text: (v, tg) => {
      const c = dxa(v, tg).crit;
      return c ? c + "-критерий" : "введите возраст"; } },
    "ДИНАМИКА": { inputs: DXA_IN, raw: true, text: (v, tg) => {
      const research = dxa(v, tg);
      const bmdMode = tg("режим динамики") === 1;
      const changes = dxaChanges(research, tg, bmdMode);
      if (!changes.length) return "";
      const metric = bmdMode ? "МПК (BMD)" : research.crit + "%";
      const unit = bmdMode ? "%" : " п. п.";
      const amounts = changes.map(({ d, where }) => {
        const magnitude = fmt(Math.abs(d), 1).replace(/,0$/, "");
        const sign = magnitude === "0" ? "" : d < 0 ? "−" : "+";
        return where + " " + sign + magnitude + unit;
      }).join(", ");
      return metric + " " + amounts + (bmdMode ? "." : "");
    } },
    "TOTAL BMD": { inputs: ["BMC total", "Area total"], digits: 3,
      f: (bmc, area) => bmc > 0 && area > 0 ? bmc / area : NaN },
    "МИОПЕНИЯ": { inputs: ["RSMI"], hidden: true, uses: ["пол"], set: (v, tg) => {
      const rsmi = v[0];
      if (!(Number.isFinite(rsmi) && rsmi > 0)) return { "миопения": 0 };
      return { "миопения": rsmi < (tg("пол") === 0 ? 5.5 : 7.0) ? 2 : 1 };
    } },
    "ЧЕРЕЗ 1 ГОД":  { inputs: [], raw: true, text: inYears(1) },
    "ЧЕРЕЗ 2 ГОДА": { inputs: [], raw: true, text: inYears(2) },
    // невидимый: ставит {#МПК: не введено|норма|остеопения|остеопороз|в пределах ожидаемых|ниже ожидаемых},
    // {#контроль через: 1 год|2 года}, {#консультация: не введено|гериатр|эндокринолог|нет}
    "ДЕНСИТОМЕТРИЯ": { inputs: DXA_IN, hidden: true, uses: DXA_USES, set: (v, tg) => {
      const { crit, age, regions, get } = dxa(v, tg);
      const out = { "консультация": !isFinite(age) ? 0 : age >= 75 ? 1 : 2 };
      const vals = crit ? regions.map(r => get(crit + " " + r.k)).filter(isFinite).map(r1) : [];
      if (!vals.length) Object.assign(out, { "МПК": 0, "контроль через": 0 });
      else {
        const w = Math.min(...vals);
        const dx = crit === "T" ? (w >= -1 ? 1 : w > -2.5 ? 2 : 3) : (w > -2 ? 4 : 5);
        Object.assign(out, { "МПК": dx, "контроль через": dx === 1 || dx === 4 ? 1 : 0 });
        if (dx === 1 || dx === 4) out["консультация"] = 3;          // норма — консультацию не пишем
      }
      return out;
    } },
    // TBS у всех в протоколе; интерпретация в заключении — женщины после менопаузы и мужчины > 50 лет,
    // только если значение TBS введено. Критерий T/Z для МПК определяется независимо (мужчины ≥ 50 лет).
    "TBS ИНТЕРПРЕТАЦИЯ": { inputs: ["TBS", "Возраст"], hidden: true, uses: ["пол", "менопауза"], set: (v, tg) => {
      const [tbs, age] = v;
      const eligible = tg("пол") === 0 ? tg("менопауза") === 0 : Number.isFinite(age) && age > 50;
      return { "TBS интерпретация": eligible && Number.isFinite(tbs) && tbs > 0 ? 1 : 0 };
    } },
    // TBS L1–L4: > 1,35 — норма; 1,20 < TBS ≤ 1,35 — частичное нарушение; ≤ 1,20 — полное. Ставит {#TBS вывод: не введено|…}
    "TBS ВЫВОД": { inputs: ["TBS"], hidden: true, set: v => {
      const x = v[0];
      return { "TBS вывод": !(isFinite(x) && x > 0) ? 0 : x > 1.35 ? 1 : x > 1.2 ? 2 : 3 };
    } },
    // FRAX: 10-летняя вероятность основных остеопоротических переломов против российского возрастного порога.
    // Пишет «ниже точки терапевтического вмешательства для возраста 74 лет» (сам порог в заключение не идёт). Для бедра порога в КР нет — не интерпретируем.
    "FRAX ВЫВОД": { inputs: ["Возраст", "FRAX осн"], raw: true, text: v => fraxText(v[0], v[1]) },
    // невидимый: вне 40–90 лет таблицы КР нет — строку FRAX из заключения убираем: {#FRAX возраст: строка|}
    "FRAX ВОЗРАСТ": { inputs: ["Возраст"], hidden: true, set: v => {
      const a = Math.floor(v[0]);
      return { "FRAX вне 40–90 лет": isFinite(a) && (a < 40 || a > 90) ? 1 : 0 };
    } }
  });

  /* Точка терапевтического вмешательства FRAX для РФ, % (основные остеопоротические переломы), по возрасту 40–90 лет.
     КР «Остеопороз» МЗ РФ, таблица точек вмешательства (Лесняк О.М. и др., модель FRAX для России).
     Порог = вероятность у женщины того же возраста с низкотравматичным переломом в анамнезе, ИМТ 24, без других факторов риска.
     После 81 года порог снижается: конкурирующая смертность. Младше 40 и старше 90 — в заключении строки нет. */
  const FRAX_IT = [10.75, 11.05, 11.34, 11.61, 11.9, 12.2, 12.5, 12.79, 13.07, 13.35,       // 40–49
    13.61, 13.89, 14.14, 14.43, 14.73, 15.03, 15.34, 15.69, 16.02, 16.39,                    // 50–59
    16.77, 17.03, 17.32, 17.56, 17.79, 18.04, 18.28, 18.55, 18.81, 19.09,                    // 60–69
    19.3, 19.69, 20.16, 20.69, 21.2, 21.71, 22.07, 22.4, 22.73, 22.84,                       // 70–79
    22.85, 22.9, 22.74, 22.37, 21.84, 21.11, 20.36, 19.32, 18.08, 16.84,                     // 80–89
    15.73];                                                                                  // 90
  const yearsGen = n => n % 10 === 1 && n % 100 !== 11 ? "года" : "лет";   // «для возраста 71 года», «74 лет»
  function fraxText(age, x) {
    if (!isFinite(x) || x < 0) return "";
    if (!isFinite(age)) return "введите возраст";
    const a = Math.floor(age);
    if (a < 40 || a > 90) return "";
    const it = r1(FRAX_IT[a - 40]), ages = a + " " + yearsGen(a);
    const xr = r1(x), where = xr > it ? "выше" : xr < it ? "ниже" : "на уровне";
    return where + " точки терапевтического вмешательства для возраста " + ages;
  }

  window.RH_CALC = CALC;                              // для автотестов (tests/), на работу сайта не влияет
  window.RH_TEMPLATE = (text, el) => buildTemplate(text, el);
  const INPUT_NAMES = new Set(Object.values(CALC).flatMap(c => c.inputs).concat(["T total", "T% total", "Z total", "Z% total"]));
  const num = v => parseFloat(String(v).replace(/[−–—]/g, "-").replace(",", "."));
  const fmt = (x, d) => x.toFixed(d).replace(".", ",");

  function buildTemplate(text, el) {
    el.innerHTML = "";
    const parts = [], calcs = [], named = {}, linked = {}, toggles = {}, lists = [], lineEls = [];
    const willisFields = new Map();
    const visibleWhen = new Map();
    const PH_OF = new Map();                    // «+ имя» пустого варианта → { group, inst }
    let missing = [];                           // незаполненное в копируемом тексте: [{ label, el }] — собирается при каждом text()
    // В DXA предыдущие проценты храним отдельно для T и Z. При смене пациента не подменяем один критерий другим.
    const dxaPrevious = { T: {}, Z: {} };
    let dxaPreviousCrit = null;
    const EMPTY = "\u0000";                     // пустой вариант: строка, где только он, при копировании исчезает
    // {{калькулятор}} | {переключатель} — внутри него можно {{калькулятор}} и ещё один {переключатель} (одна вложенность) | [поле]
    const CALC_RE = String.raw`\{\{[^{}\n]*\}\}`;
    const INNER_RE = String.raw`\{(?:[^{}\n]|${CALC_RE})*\}`;                 // вложенный переключатель
    const PART_RE = String.raw`(?:[^{}\n]|${CALC_RE}|${INNER_RE})*`;
    // ((…)) — видно на экране, но не копируется: поля для расчётов прямо внутри фразы
    const re = new RegExp(String.raw`\{\{\s*([^{}]+?)\s*\}\}|\{(${PART_RE}\|${PART_RE})\}|\[([^\[\]\n]*)\]|\(\(((?:(?!\)\))[^\n])*)\)\)`, "g");
    // делит варианты по | только снаружи вложенных {…}
    function splitTop(str) {
      const res = []; let depth = 0, cur = "";
      for (const ch of str) {
        if (ch === "{") depth++;
        if (ch === "}") depth--;
        if (ch === "|" && depth === 0) { res.push(cur); cur = ""; } else cur += ch;
      }
      res.push(cur);
      return res;
    }

    // номер выбранного варианта именованного переключателя (0, если такого нет)
    const tg = n => { const g = toggles["#" + lower(n)]; return g ? g.i % Math.max(...g.insts.map(x => x.views.length)) : 0; };
    function recalc() {
      // Переключение T ↔ Z меняет и текущую базу сравнения, и поля прошлого исследования.
      if (named["Возраст"] && named["было позв"] && toggles["#пол"]) {
        const age = num(named["Возраст"][0].value);
        const crit = tg("пол") === 0 ? (tg("менопауза") === 0 ? "T" : "Z")
          : Number.isFinite(age) ? (age >= 50 ? "T" : "Z") : null;
        if (crit && dxaPreviousCrit && crit !== dxaPreviousCrit) {
          DXA.forEach(r => {
            const fields = named["было " + r.k];
            if (!fields) return;
            dxaPrevious[dxaPreviousCrit][r.k] = fields[0].value;
            const remembered = dxaPrevious[crit][r.k] || "";
            fields.forEach(f => { f.value = remembered; sizeField(f); });
          });
        }
        if (crit) dxaPreviousCrit = crit;
      }
      calcs.forEach(c => {
        const def = CALC[c.name];
        const vals = def.inputs.map(n => num(named[n] ? named[n][0].value : NaN));
        if (def.raw) {                                             // текст из любых значений (пустые — NaN) и переключателей
          c.value = def.text(vals, tg) || "";
          c.el.textContent = c.value || (def.optional ? "" : "__");
          return;
        }
        if (def.text) {                                            // калькулятор, который пишет текст, а не число
          c.value = vals.every(x => isFinite(x) && x > 0) ? def.text(...vals) : "";
          c.el.textContent = c.value || "__";
          return;
        }
        const x = vals.every(isFinite) ? def.f(...vals) : NaN;
        c.value = isFinite(x) && x >= 0 ? fmt(x, def.digits) : "";
        c.el.textContent = c.value || "__";
        // порог: сравниваем уже округлённое значение, чтобы 0,30 на экране не считалось расширением
        const g = def.toggle && toggles["#" + lower(def.toggle)];
        if (g && c.value) { g.i = def.pick(def.pickRaw ? x : num(c.value)); g.show(); }
        else if (g && def.reset) { g.i = 0; g.show(); }
      });
      // невидимые калькуляторы: сами ставят переключатели, если все их поля есть в шаблоне
      Object.values(CALC).forEach(def => {
        if (!def.set || !def.inputs.every(n => named[n])) return;
        const vals = def.inputs.map(n => num(named[n][0].value));
        Object.entries(def.set(vals, tg)).forEach(([n, i]) => {
          const g = toggles["#" + lower(n)];
          if (g) { g.i = i; g.show(); }
        });
      });
      if (calcs.some(c => CALC[c.name].optional)) tidy();
    }
    // переключатели, от которых зависят невидимые калькуляторы (uses), при нажатии пересчитывают
    const USED = new Set(Object.values(CALC).flatMap(d => (d.uses || []).map(n => "#" + lower(n))));
    function sizeField(f) { f.style.width = Math.max(3, (f.value || f.placeholder).length + 1) + "ch"; }

    // подпись пустого поля [__] для «Не заполнено: …»: до 3 слов перед ним в пределах фразы
    // («Атрофия по шкале GCA [__]» → «по шкале GCA»); у именованных полей и калькуляторов подпись — имя
    function labelOf(before) {
      const clause = before.replace(/\{\{[^{}]*\}\}/g, " ").replace(/\[[^\[\]]*\]/g, " ").replace(/[{}|#]/g, " ")
        .split(/[.;:,(=]/).pop();
      const w = clause.split(/\s+/).filter(x => /[A-Za-zА-Яа-яЁё0-9]/.test(x));
      while (w.length && w[w.length - 1].length <= 2) w.pop();            // «…позвонка на» → «…позвонка»
      return w.slice(-3).join(" ") || "поле";
    }

    function field(inner, target, out, before) {                  // [поле]
      inner = inner.trim();
      const f = document.createElement("input");
      f.className = "fld"; f.type = "text"; f.autocomplete = "off";
      const lk = inner.match(/^#\s*([^=]+?)\s*(?:=\s*(.*))?$/);    // [#имя] или [#имя = текст] — связанное поле: все [#имя] заполняются вместе
      if (INPUT_NAMES.has(inner)) {
        f.placeholder = PH[inner] || inner; f.inputMode = "decimal"; f.dataset.name = inner;
        (named[inner] = named[inner] || []).push(f);
        f.addEventListener("input", () => {
          named[inner].forEach(o => { if (o !== f) { o.value = f.value; sizeField(o); } });
          recalc();
        });
      } else if (lk) {
        const k = lower(lk[1].trim());
        f.placeholder = ["дата предыдущего исследования", "дата операции"].includes(k) ? "дд.мм.гггг" : "__";
        if (lk[2]) f.value = lk[2].trim();
        (linked[k] = linked[k] || []).push(f);
        f.addEventListener("input", () => linked[k].forEach(o => { if (o !== f) { o.value = f.value; sizeField(o); } }));
      } else if (!inner || /^_+$/.test(inner)) {
        f.placeholder = "__";
      } else {
        f.value = inner;
      }
      f.addEventListener("input", () => sizeField(f));
      sizeField(f);
      const label = INPUT_NAMES.has(inner) ? inner : labelOf(before || "");
      out.push(() => {
        if (f.value.trim()) return f.value.trim();
        missing.push({ label, el: f });
        return "[__]";
      });
      target.append(f);
    }

    function toggle(inner, target, out, depth) {                         // {а|б|в} или {#имя: а|б|в}
      let name = null, multi = false;
      const ms = inner.match(/^\s*\*([^:|]*):\s*/);                       // {*имя: +а|б|в} — выбор нескольких
      const explicitSelect = inner.trimStart().startsWith("!");
      const nm = inner.match(/^\s*[#!]([^:|]+):\s*/);
      if (ms) { multi = true; name = ms[1].trim() || null; inner = inner.slice(ms[0].length); }
      else if (nm) { name = nm[1].trim(); inner = inner.slice(nm[0].length); }
      let opts = splitTop(inner).map(x => x.trim());
      // список: 5 и больше коротких вариантов без полей и скобок (позвонки) — выпадающий список; «+» — выбран по умолчанию
      const pick = explicitSelect || multi || (opts.length >= 5 && opts.every(o => /^\+?[^\[\]{}()]{1,8}$/.test(o)));
      const def = pick ? opts.map((o, k) => o.startsWith("+") ? k : -1).filter(k => k >= 0) : [];
      if (pick) opts = opts.map(o => o.replace(/^\+\s*/, ""));
      // связаны переключатели с одним именем или с одинаковыми вариантами
      const key = (multi ? "*" : name ? "#" : "") + (name ? lower(name) : opts.join("|"));
      const fresh = !toggles[key];
      const group = toggles[key] = toggles[key] || { i: 0, insts: [], sel: new Set() };
      if (fresh && def.length) { group.i = def[0]; def.forEach(k => group.sel.add(k)); }
      if (multi) return multiPick(opts, group, target, out);
      if (pick) return dropdown(opts, group, key, target, out);

      const wrap = document.createElement("span");
      wrap.className = "tg"; wrap.tabIndex = 0; wrap.setAttribute("role", "button");
      // Автоматическая строка TBS не должна показывать служебное «+ TBS интерпретация».
      if (name === "TBS интерпретация") wrap.dataset.autoHideEmpty = "1";
      wrap.title = "Нажмите, чтобы сменить вариант";
      const views = opts.map(o => {
        const span = document.createElement("span");
        const p = [];
        if (!o) { span.className = "opt-empty"; span.textContent = name ? "+ " + name : "—"; }
        else parse(o, span, p, depth + 1);
        wrap.append(span);
        return { span, p, empty: !o };
      });
      const inst = { views, update: () => {
        views.forEach((v, k) => { v.span.hidden = k !== group.i % views.length; });
        if (wrap.dataset.autoHideEmpty) wrap.hidden = group.i % views.length === 0;
      } };
      views.forEach(v => { if (v.empty) PH_OF.set(v.span, { group, inst }); });
      group.insts.push(inst);
      const show = groupShow(group);
      const next = () => {
        group.i = (group.i + 1) % Math.max(...group.insts.map(g => g.views.length));
        show();
        if (USED.has(key)) recalc();
      };
      // клик по вложенному переключателю меняет только его
      wrap.addEventListener("click", e => { if (!e.target.closest("input, select") && e.target.closest(".tg") === wrap) next(); });
      wrap.addEventListener("keydown", e => {
        if (e.target === wrap && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
      });
      show();
      out.push(() => {
        const v = views[group.i % views.length];
        return v.empty ? EMPTY : v.p.map(f => f()).join("");
      });
      target.append(wrap);
    }
    function groupShow(group) {
      return group.show = () => {
        group.insts.forEach(g => g.update());
        lists.forEach(f => f());                                  // переключатель сменился — пересобрать перечни
        tidy();
      };
    }
    // Строка, где видно только «+ имя», а тот же переключатель уже показан выше с текстом (описание → заключение),
    // или только пустой перечень, на экране прячется: нажимать там нечего, а пустые строки мешают читать.
    function hasContent(node) {
      for (const c of node.childNodes) {
        if (c.nodeType === 3) { if (c.textContent.trim()) return true; continue; }
        if (c.nodeType !== 1 || c.hidden || PH_OF.has(c)) continue;
        if (c.tagName === "INPUT" || c.tagName === "SELECT" || hasContent(c)) return true;
      }
      return false;
    }
    function tidy() {
      lineEls.forEach(ln => {
        if (visibleWhen.has(ln) && !visibleWhen.get(ln)()) { ln.hidden = true; return; }
        if (!ln.children.length) { ln.hidden = false; return; }                        // пустая строка-разделитель из шаблона остаётся
        const phs = [...ln.querySelectorAll(".opt-empty")].filter(x => PH_OF.has(x) && !x.hidden);
        const echo = phs.every(x => {
          const { group, inst } = PH_OF.get(x);
          return group.insts.some(g => {
            if (g === inst || g.views.length < 2) return false;
            const v = g.views[group.i % g.views.length];
            // тот же переключатель уже виден выше: с текстом или своим «+ имя» — второй «+ имя» не нужен
            return !v.empty || !!(v.span.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_FOLLOWING);
          });
        });
        // Скрываем пустые автоматические строки, оставляя обычные «+ ...» для ручного выбора.
        ln.hidden = (echo || !!ln.querySelector("[data-auto-hide-empty]")) && !hasContent(ln);
      });
    }

    // выпадающий список: {#позвонок: L1|L2|L3|L4|L5} — варианты те же, что у переключателя, только выбираются из списка
    function dropdown(opts, group, key, target, out) {
      const sel = document.createElement("select");
      sel.className = "tg sel"; sel.title = "Выберите из списка";
      if (key.startsWith("#")) sel.setAttribute("aria-label", key.slice(1));
      opts.forEach(o => sel.add(new Option(o)));
      const inst = { views: opts.map(() => ({})), update: () => { sel.selectedIndex = group.i % opts.length; } };
      group.insts.push(inst);
      const show = groupShow(group);
      sel.addEventListener("change", () => { group.i = sel.selectedIndex; show(); if (USED.has(key)) recalc(); });
      show();
      out.push(() => opts[group.i % opts.length]);
      target.append(sel);
    }

    // выбор нескольких: {*имя: +L1|L2|L3} — тап раскрывает варианты, каждый включается и выключается; в текст — через запятую
    function multiPick(opts, group, target, out) {
      const wrap = document.createElement("span");
      wrap.className = "tg ms"; wrap.tabIndex = 0; wrap.setAttribute("role", "button");
      wrap.title = "Нажмите, чтобы выбрать";
      const val = document.createElement("span");
      const box = document.createElement("span");
      box.className = "ms-box"; box.hidden = true;
      const chips = opts.map((o, k) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "ms-chip"; b.textContent = o;
        b.addEventListener("click", e => {
          e.stopPropagation();
          group.sel.has(k) ? group.sel.delete(k) : group.sel.add(k);
          group.show();
        });
        box.append(b);
        return b;
      });
      const done = document.createElement("button");
      done.type = "button"; done.className = "ms-done"; done.textContent = "готово";
      done.addEventListener("click", e => { e.stopPropagation(); close(); });
      box.append(done);
      wrap.append(val, box);
      const text = () => opts.filter((o, k) => group.sel.has(k)).join(", ");
      const inst = { views: [{}], update: () => {
        const t = text();
        val.textContent = t || "выбрать";
        val.className = t ? "" : "opt-empty ms-ph";
        chips.forEach((b, k) => b.setAttribute("aria-pressed", group.sel.has(k)));
      } };
      group.insts.push(inst);
      groupShow(group)();
      const outside = e => { if (!wrap.contains(e.target)) close(); };
      function close() { box.hidden = true; val.hidden = false; document.removeEventListener("click", outside, true); }
      function open() { box.hidden = false; val.hidden = true; document.addEventListener("click", outside, true); }
      wrap.addEventListener("click", e => { if (e.target.closest(".tg") === wrap && box.hidden) open(); });
      wrap.addEventListener("keydown", e => {
        if (e.target === wrap && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); box.hidden ? open() : close(); }
      });
      out.push(() => {
        const t = text();
        if (t) return t;
        missing.push({ label: "выбрать", el: wrap });
        return "[__]";
      });
      target.append(wrap);
    }

    // {{ПЕРЕЧЕНЬ: имена | № | одно | несколько | ни одного | все}} и {{ВСЕ: имена | № | текст}}
    // В ПЕРЕЧНЕ имя=подпись заменяет подпись. Во ВСЕ имя=1/3 задаёт допустимые варианты для этого переключателя.
    function list(spec, target, out, all) {
      const p = spec.split("|").map(x => x.trim());
      const n = +p[1];
      const items = p[0].split(",").map(x => x.trim()).filter(Boolean).map(x => {
        const [name, value] = x.split("=").map(s => s.trim());
        return { name, label: value || name, variants: all && value ? value.split("/").map(Number) : [n] };
      });
      const span = document.createElement("span");
      span.className = "calc";
      let text = "";
      lists.push(() => {
        const on = items.filter(({ name, variants }) => {
          const group = toggles["#" + lower(name)];
          return group && variants.includes(group.i + 1);
        }).map(x => x.label);
        if (all) text = on.length === items.length ? p[2] || "" : "";
        else if (on.length === items.length && p[5] !== undefined) text = p[5];
        else if (!on.length) text = p[4] || "";
        else text = (on.length > 1 ? p[3] : p[2]).replace("*", on.join(", "));
        span.textContent = text;
      });
      out.push(() => text || EMPTY);
      target.append(span);
    }

    function parse(str, target, out, depth) {          // depth: 0 — текст шаблона, 1 — внутри переключателя, 2 — внутри вложенного
      re.lastIndex = 0;
      const found = [];
      let m;
      while ((m = re.exec(str))) found.push([m.index, re.lastIndex, m[1], m[2], m[3], m[4], m[0]]);
      let last = 0;
      for (const [start, end, calc, tg, fld, hid, raw] of found) {
        if (start > last) { const t = str.slice(last, start); target.append(t); out.push(() => t); }
        last = end;
        if (hid !== undefined) {                                  // ((…)) — на экране есть, в копию не идёт
          const span = document.createElement("span");
          span.className = "hid"; span.title = "Не копируется";
          parse(hid, span, [], depth);
          target.append(span);
        } else if (calc === "ВИЛЛИЗИЕВ ОПИСАНИЕ" || calc === "ВИЛЛИЗИЕВ ЗАКЛЮЧЕНИЕ") {
          const span = document.createElement("span");
          const key = calc.endsWith("ОПИСАНИЕ") ? "description" : "conclusion";
          willisFields.set(key, span);
          if (key === "conclusion") span.setAttribute("aria-live", "polite");
          target.append(span);
          out.push(() => span.textContent || EMPTY);
        } else if (calc !== undefined && /^перечень\s*:/i.test(calc)) {  // {{ПЕРЕЧЕНЬ: имена | № варианта | одно | несколько}}
          list(calc.replace(/^перечень\s*:/i, ""), target, out);
        } else if (calc !== undefined && /^все\s*:/i.test(calc)) {       // {{ВСЕ: имена | № варианта | текст}}
          list(calc.replace(/^все\s*:/i, ""), target, out, true);
        } else if (calc !== undefined) {                          // {{КАЛЬКУЛЯТОР}}, в том числе внутри переключателя
          const key = Object.keys(CALC).find(k => lower(k) === lower(calc));
          const span = document.createElement("span");
          span.className = "calc";
          if (!key) {
            span.classList.add("bad"); span.textContent = raw;
            span.title = "Нет такого калькулятора. Есть: " + Object.keys(CALC).join(", ");
            out.push(() => raw);
          } else {
            const c = { name: key, el: span, value: "" };
            calcs.push(c);
            out.push(() => {
              if (c.value) return c.value;
              if (CALC[key].optional) return EMPTY;
              // подсветить пустое поле, из которого считается (оно может быть и в жёлтой строке «> …»)
              const n = CALC[key].inputs.find(n => named[n] && named[n].some(i => !i.value.trim()));
              missing.push(n ? { label: n, el: named[n].find(i => !i.value.trim()) } : { label: key, el: span });
              return "[__]";
            });
          }
          target.append(span);
        } else if (tg !== undefined && depth < 2) {
          toggle(tg, target, out, depth);
        } else if (fld !== undefined) {
          field(fld, target, out, str.slice(0, start));
        } else {                                                  // скобки, которые здесь не работают, — как текст
          target.append(raw); out.push(() => raw);
        }
      }
      if (last < str.length) { const t = str.slice(last); target.append(t); out.push(() => t); }
    }

    // строка «> …» — пульт: поля и переключатели для расчётов (пол, возраст…); видна, но в копируемый текст не попадает
    const lines = text.split("\n");
    lines.forEach((line, i) => {
      const condition = line.match(/^\?([^=]+)=(\d+)>\s*/);
      const active = () => {
        const name = lower(condition[1]);
        const index = Number(condition[2]) - 1;
        return toggles["*" + name]?.sel.has(index) || toggles["#" + name]?.i === index;
      };
      if (condition) line = line.slice(condition[0].length);
      const ctl = line.match(/^>\s?(.*)$/);
      const folded = ctl?.[1].match(/^\[([^\]]+)\]\s+(.*)$/);
      const kl = ctl?.[1].match(/^Келлгрен — Лоуренс: (колено|ТБС)$/);
      if (ctl?.[1] === "Атлас: чашка" || ctl?.[1] === "Атлас: стопа") {
        addPostopGuide(el, ctl[1] === "Атлас: чашка");
      } else if (ctl?.[1] === "Атлас: височная кость") {
        addTemporalGuide(el);
      } else if (kl) {
        addKellgrenGuide(el, kl[1]);
      } else if (line.trim() === "> {{ВИЛЛИЗИЕВ КРУГ}}") {
        const panel = document.createElement("section");
        if (condition) visibleWhen.set(panel, active);
        el.append(panel);
        lineEls.push(panel);
        window.createWillisDiagram(panel, result => {
          for (const [key, span] of willisFields) span.textContent = result ? result[key] : "";
          tidy();
        });
      } else if (ctl) {
        const box = document.createElement(folded ? "details" : "div");
        box.className = "ctl";
        if (folded) {
          const summary = document.createElement("summary");
          summary.textContent = folded[1];
          box.append(summary);
        }
        parse(folded ? folded[2] : ctl[1], box, [], 0);
        if (condition) {
          visibleWhen.set(box, active);
          lineEls.push(box);
        }
        el.append(box);
      } else {
        const ln = document.createElement("span");
        ln.className = "ln";
        // ?группа=номер> показывает и копирует строку только для выбранного варианта.
        const output = condition ? [] : parts;
        if (condition) {
          visibleWhen.set(ln, active);
          parts.push(() => active() ? output.map(read => read()).join("") : "");
        }
        parse(line + (i < lines.length - 1 ? "\n" : ""), ln, output, 0);
        el.append(ln);
        lineEls.push(ln);
      }
    });
    if (named["Рога"] && named["Череп"]) addEvansGuide(named["Рога"]);
    recalc();
    lists.forEach(f => f());
    tidy();
    return {
      // что осталось незаполненным в том тексте, который уйдёт при копировании (скрытые варианты {а|б} не считаются)
      missing: () => {
        missing = []; parts.forEach(p => p());
        const seen = new Set(), m = missing.filter(x => !seen.has(x.el) && seen.add(x.el));   // поле и его калькулятор — один раз
        missing = []; return m;
      },
      text: () => parts.map(p => p()).join("")
        .split("\n").filter(l => !(l.includes(EMPTY) && !l.replace(/\u0000/g, "").trim())).join("\n")
        .replace(/\u0000/g, "")
        .replace(/[ \t]{2,}/g, " ")
        .replace(/[ \t]+\n/g, "\n").replace(/\n[ \t]+/g, "\n")
        .replace(/ +([.,;:])/g, "$1")
        .replace(/\n{3,}/g, "\n\n")
        .trim()
    };
  }

  let toastTimer;
  function toast(m, ms) {
    toastEl.textContent = m; toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms || 1800);
  }
  function copy(text) {
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      toast(ok ? "Скопировано" : "Не удалось скопировать — выделите текст вручную");
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast("Скопировано"), fallback);
    else fallback();
  }
})();
</script>
<script>
/* «Что нового»: content/news.md у врача, content/news_lab.md у лаборанта. «# …» — заголовок, «- …» — пункт.
   [[слово]] подставляет запрос в поиск врача; [текст](?lab#раздел) открывает раздел у лаборанта.
   На главной — три верхних выпуска. Ссылка в заголовке открывает архив выбранной ленты. */
(function () {
  const HOME = 3;
  const box = document.getElementById("news");
  const q = document.getElementById("q");
  const dlg = document.getElementById("newsArchive");
  const all = document.getElementById("newsArchiveBody");
  if (!box || location.protocol === "file:") return;
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const line = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[\[([^\]]+)\]\]/g, '<span class="try" role="button" tabindex="0" data-q="$1">«$1»</span>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[([^\]]+)\]\(((?:\?|\/)[^)\s]*)\)/g, '<a href="$2">$1</a>');   // ссылка внутри сайта, например ?lab
  const html = blocks => blocks.map(b =>
    (b.h ? "<h2>" + line(b.h) + "</h2>" : "") +
    "<ul>" + b.items.map(i => "<li>" + line(i) + "</li>").join("") + "</ul>"
  ).join("");

  // [[слово]] — подставить в поиск (из архива — сначала закрыть окно)
  function tryHandlers(root, before) {
    const go = el => { if (before) before(); q.value = el.dataset.q; q.dispatchEvent(new Event("input")); q.focus(); };
    root.addEventListener("click", e => { const el = e.target.closest(".try"); if (el) go(el); });
    root.addEventListener("keydown", e => { const el = e.target.closest(".try"); if (el && e.key === "Enter") go(el); });
  }
  const close = () => {
    if (!dlg.open) return;
    if (typeof dlg.close === "function") dlg.close();
    else dlg.removeAttribute("open");
  };

  fetch(window.RH_LAB ? "content/news_lab.md" : "content/news.md", { cache: "no-cache" }).then(r => r.ok ? r.text() : "").then(t => {
    let blocks = [];
    t.replace(/\r/g, "").split("\n").forEach(l => {
      l = l.trim();
      if (/^# /.test(l)) blocks.push({ h: l.slice(2), items: [] });
      else if (/^[-*] /.test(l)) {
        if (!blocks.length) blocks.push({ h: "", items: [] });
        blocks[blocks.length - 1].items.push(l.slice(2));
      }
    });
    blocks = blocks.filter(b => b.items.length);
    if (!blocks.length) return;

    box.innerHTML = html(blocks.slice(0, HOME));
    box.hidden = false;
    tryHandlers(box);

    const heading = box.querySelector("h2");
    if (!heading || !dlg) return;
    all.innerHTML = html(blocks);
    tryHandlers(all, close);
    all.addEventListener("click", e => {
      if (e.target.closest('a[href^="?lab#"]')) close();
    });
    const link = document.createElement("a");
    link.href = "#newsArchive";
    link.textContent = heading.textContent;
    link.setAttribute("aria-haspopup", "dialog");
    heading.replaceChildren(link);
    const openArchive = () => {
      if (dlg.open) return;
      if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
      dlg.scrollTop = 0;
    };
    link.addEventListener("click", event => { event.preventDefault(); openArchive(); });
    if (location.hash === link.hash) openArchive();
    dlg.querySelector(".news-arch-x").addEventListener("click", close);
    dlg.addEventListener("click", e => { if (e.target === dlg) close(); });   // клик мимо окна
  }).catch(() => {});
})();
</script>

<script>
/* Примеры на главной и возврат домой.
   Примеры: content/examples.txt — по одному на строке, при каждом открытии 3 случайных; клик подставляет текст в поиск.
   Домой: кот слева от поиска или Esc в строке поиска — очищает запрос и возвращает на пустую главную.
   Esc работает только в строке поиска: в полях шаблона он стёр бы всё, что врач уже набрал. */
(function () {
  const q = document.getElementById("q");
  const ex = document.getElementById("examples");
  const fine = window.matchMedia && matchMedia("(pointer: fine)").matches;   // мышь, а не палец: ставить курсор в поиск

  function home() {
    q.value = "";
    q.dispatchEvent(new Event("input"));
    document.body.classList.add("home");
    history.replaceState(null, "", location.pathname + location.search);  // убрать #раздел, ?lab оставить
    window.scrollTo(0, 0);
    if (fine && !window.RH_LAB) q.focus();
  }
  document.getElementById("homeBtn").addEventListener("click", home);
  q.addEventListener("keydown", e => { if (e.key === "Escape" && (q.value || document.body.classList.contains("protocol-view"))) { e.preventDefault(); home(); } });

  if (window.RH_LAB || !ex || location.protocol === "file:") return;          // у лаборанта на главной кнопки разделов
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  fetch("content/examples.txt", { cache: "no-cache" }).then(r => r.ok ? r.text() : "").then(t => {
    const all = t.replace(/\r/g, "").split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"));
    if (!all.length) return;
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    ex.innerHTML = "Шаблоны заключений и подсказки для рентгенолога. Например: " +
      all.slice(0, 3).map(x => '<span class="try" role="button" tabindex="0" data-q="' + esc(x) + '">' + esc(x) + "</span>").join(" · ");
    ex.hidden = false;
    const go = el => { q.value = el.dataset.q; q.dispatchEvent(new Event("input")); if (fine) q.focus(); };
    ex.addEventListener("click", e => { const el = e.target.closest(".try"); if (el) go(el); });
    ex.addEventListener("keydown", e => { const el = e.target.closest(".try"); if (el && e.key === "Enter") go(el); });
  }).catch(() => {});
})();
</script>
