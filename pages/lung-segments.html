<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/brand.css">
  <link rel="stylesheet" href="../assets/css/lung-location.css">
  <script src="../assets/js/lung-location-model.js" defer></script>
  <script src="../assets/js/lung-location-diagram.js" defer></script>
  <script src="../assets/js/lung-location-picker.js" defer></script>

<body class="lung-demo">
  <header class="lung-demo-bar">
    <div class="lung-demo-shell">
      <a class="rh-logo" href="../" aria-label="RadHelper — на главную">
        <img src="../assets/img/brand-slice.png" alt=""><span class="rh-rad"></span><span class="rh-helper"></span>

  </header>
  <main class="lung-demo-shell">
    <h1>Рентгенография ОГК</h1>
    <p class="lung-demo-intro">Выберите область на схеме, затем укажите находку.</p>
    <div id="lung-findings-demo"></div>

    </footer>
