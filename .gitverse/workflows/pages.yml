name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Автотесты расчётов и содержимого. Упали — сайт не обновится, а в логе будет, что сломалось.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: |
          npm ci
          npm test

      - name: Build site files
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          test -f _site/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v1.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v1.0.0